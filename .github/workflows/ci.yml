name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  gui:
    name: GUI build, minify & cross-compat
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: |
          pip install -e .
          npm ci
      - name: Rebuild and minify, then check the committed assets are current
        run: |
          python tools/build.py
          node tools/minify.mjs
          git diff --exit-code -- \
            lockhtml/templates/viewer.html \
            lockhtml/templates/viewer-argon2.html \
            lockhtml/gui/index.html \
            || (echo "::error::generated assets are out of date — run 'make build'"; exit 1)
      - name: Lock a file with the GUI code path
        run: node tools/check_gui_compat.mjs /tmp/gui_locked.html
      - name: Confirm the CLI can open a GUI-locked file
        run: |
          lockhtml unlock /tmp/gui_locked.html --pin 4821 | grep -q "ORION-7742"
          echo "cross-implementation compatibility: OK"

  browser:
    name: end-to-end in a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
          cache: npm
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce   # was @v1
        id: chrome
      - name: Install
        run: |
          pip install -e .
          npm ci
      - name: Embedded + streaming containers in a real browser
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          python tools/e2e_fixtures.py /tmp/lockhtml-e2e
          node tools/e2e_browser.mjs /tmp/lockhtml-e2e
      - name: GUI code path, verified by the Python core
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          node tools/e2e_gui.mjs /tmp/lockhtml-gui
          python tools/e2e_gui_verify.py /tmp/lockhtml-gui
