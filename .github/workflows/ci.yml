name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest

  gui:
    name: GUI build, minify & cross-compat
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install
        run: |
          pip install -e .
          npm ci
      - name: Rebuild and minify, then check the committed assets are current
        run: |
          python tools/build.py
          node tools/minify.mjs
          git diff --exit-code -- \
            lockhtml/templates/viewer.html \
            lockhtml/templates/viewer-argon2.html \
            lockhtml/gui/index.html \
            || (echo "::error::generated assets are out of date — run 'make build'"; exit 1)
      - name: Lock a file with the GUI code path
        run: node tools/check_gui_compat.mjs /tmp/gui_locked.html
      - name: Confirm the CLI can open a GUI-locked file
        run: |
          lockhtml unlock /tmp/gui_locked.html --pin 4821 | grep -q "ORION-7742"
          echo "cross-implementation compatibility: OK"
