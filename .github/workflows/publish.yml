name: Publish to PyPI

# Publishes the built wheel and sdist to PyPI when a GitHub Release is published.
#
# This uses PyPI "trusted publishing" (OIDC) — no API token is stored anywhere.
# It needs one thing done once, on the PyPI side: add a trusted publisher for
# this repository and the "pypi" environment. Until that is configured the
# publish job will fail; the build job still produces downloadable artifacts.

# Manual by default: publishing needs a PyPI trusted publisher to be configured
# first (PyPI → Your projects → Publishing → add a trusted publisher for this
# repo and the "pypi" environment). Until that exists the publish job fails, so
# it is not wired to the release event.
#
# Once it is configured, add this back to publish automatically on every release:
#   release:
#     types: [published]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0   # was @v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # was @v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # was @v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086   # was @release/v1
