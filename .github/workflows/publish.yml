name: Publish to PyPI

# Publishes the built wheel and sdist to PyPI when a GitHub Release is published.
#
# This uses PyPI "trusted publishing" (OIDC) — no API token is stored anywhere.
# It needs one thing done once, on the PyPI side: add a trusted publisher for
# this repository and the "pypi" environment. Until that is configured the
# publish job will fail; the build job still produces downloadable artifacts.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
