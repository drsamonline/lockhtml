    var s = subtle();
    if (payload.mode === "recipient") return recipientRawKey(pin, keyfile);
    if (payload.mode === "shares") return sharesRawKey(pin, keyfile);
    var kdf = kdfName(), raw;
    if (kdf === "argon2id" || kdf === "argon2") {
      if (typeof argon2 === "undefined") throw new Error("nokdf");
      var p = kdfParams();
      var h = await argon2.hash({
        pass: pin, salt: salt, time: p.t || 2, mem: p.m || 19456,
        parallelism: p.p || 1, hashLen: 32, type: argon2.ArgonType.Argon2id
      });
      raw = new Uint8Array(h.hash);
    } else {
      var base = await s.importKey("raw", enc(pin), "PBKDF2", false, ["deriveBits"]);
      raw = new Uint8Array(await s.deriveBits(
        { name: "PBKDF2", salt: salt, iterations: kdfParams().iter || 250000, hash: "SHA-256" },
        base, 256));
    }
    // keyfile is mixed in as a pepper, matching the Python core exactly
    if (keyfile && keyfile.length) raw = await hmac256(raw, keyfile);
    return raw;
  }
  async function deriveKey(pin, keyfile) {
    var raw = await rawKey(pin, b64ToBytes(payload.salt), keyfile);
    return subtle().importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
  }

  async function decryptBlob(blob, pin, keyfile) {
    var s = subtle();
    var key;
    if (blob === payload) { key = await deriveKey(pin, keyfile); }
    else {
      var saved = payload; // decoy carries its own salt/iv but same KDF params
      payload = blob; key = await deriveKey(pin, keyfile); payload = saved;
    }
    return s.decrypt({ name: "AES-GCM", iv: b64ToBytes(blob.iv) }, key, b64ToBytes(blob.ct));
  }

  /* ---- Ed25519 signature verification (optional) ---- */
  async function verifySig() {
    var sig = payload.sig;
    if (!sig) return null;
    var s = subtle();
    try {
      var probe = await s.generateKey({ name: "Ed25519" }, false, ["sign", "verify"]);
      if (!probe) return "na";
    } catch (e) { return "na"; }
    try {
      var pub = await s.importKey("raw", b64ToBytes(sig.pub), { name: "Ed25519" }, false, ["verify"]);
      var ok = await s.verify({ name: "Ed25519" }, pub, b64ToBytes(sig.val), b64ToBytes(payload.ct));
      return ok ? "ok" : "bad";
    } catch (e) { return "bad"; }
  }

  /* ---- view-limit storage (IndexedDB, localStorage fallback) ---- */
  var burnKey = "lockhtml_v2_" + payload.id;
  function idb() {
    return new Promise(function (res, rej) {
      try {
        var r = indexedDB.open("lockhtml", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore("views"); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { rej(r.error); };
      } catch (e) { rej(e); }
    });
  }
  async function getViews() {
    try {
      var db = await idb();
      return await new Promise(function (res, rej) {
        var q = db.transaction("views", "readonly").objectStore("views").get(burnKey);
        q.onsuccess = function () { res(q.result || 0); };
        q.onerror = function () { rej(q.error); };
      });
    } catch (e) {
      try { return parseInt(localStorage.getItem(burnKey) || "0", 10); } catch (_) { return 0; }
    }
  }
  async function bumpViews() {
    var n = (await getViews()) + 1;
    try {
      var db = await idb();
      await new Promise(function (res, rej) {
        var q = db.transaction("views", "readwrite").objectStore("views").put(n, burnKey);
        q.onsuccess = function () { res(); }; q.onerror = function () { rej(q.error); };
      });
    } catch (e) { try { localStorage.setItem(burnKey, String(n)); } catch (_) {} }
    return n;
  }

  function expiredState() {
    var now = Date.now();
    if (payload.notbefore && now < Date.parse(payload.notbefore)) return "early";
    if (payload.expires && now > Date.parse(payload.expires)) return "expired";
    return null;
  }

  function showBlocked(kind) {
    $("lockIcon").innerHTML = "&#128465;";
    if (kind === "early") { setText("gateTitle", T.early); setText("gateSub", T.earlySub); }
    else { setText("gateTitle", T.expired); setText("gateSub", T.expiredSub); }
    $("pin").classList.add("hidden");
    $("kfRow").classList.add("hidden");
    $("unlock").classList.add("hidden");
    $("msg").textContent = ""; 
  }

  function renderHtml(html) {
    $("viewer").srcdoc = html;
    $("dlwrap").classList.add("hidden");
    $("stage").classList.remove("hidden");
    $("gate").classList.add("hidden");
  }
  function renderFile(buf, name) {
    var blob = new Blob([buf], { type: "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name || "document.bin"; a.id = "dlAnchor";
    document.body.appendChild(a);
    setText("dlSub", name || "");
    $("dlBtn").onclick = function () { a.click(); };
    $("dlwrap").classList.remove("hidden");
    $("stage").classList.remove("hidden");
    $("gate").classList.add("hidden");
    a.click();
  }
  function applyWatermark() {
    if (!payload.watermark) return;
    setText("wmText", payload.watermark);
    $("wm").classList.remove("hidden");
  }

  async function readKeyfile() {
    var inp = $("keyfile");
    if (!payload.keyfile) return null;
    if (!inp.files || !inp.files[0]) return null;
    return new Uint8Array(await inp.files[0].arrayBuffer());
  }

  /* ---- streaming container: read + decrypt the sidecar one chunk at a time ---- */
  function equalBytes(a, b) {
    if (a.length !== b.length) return false;
    for (var i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
    return true;
  }
  function metaString(p) {
    var kp = p.kdfparams || {};
    var kps = ("m" in kp) ? (kp.m + "," + kp.t + "," + kp.p)
            : (("n" in kp) ? (String(kp.info) + "," + kp.n + "," + kp.k)
            : (("info" in kp) ? String(kp.info) : String(kp.iter)));
    var parts = ["v2", p.kdf, kps, String(p.chunkSize), String(p.chunkCount), String(p.kind),
            (p.name || ""), String(p.salt), String(p.baseiv),
            (p.maxviews == null ? "" : String(p.maxviews)),
            (p.notbefore || ""), (p.expires || "")];
    if (p.mode === "recipient") parts.push(p.eph || "");
    return parts.join("|");
  }
  async function streamDecrypt(dataFile, pin, keyfile) {
    var s = subtle();
    var raw = await rawKey(pin, b64ToBytes(payload.salt), keyfile);
    var aesKey = await s.importKey("raw", raw, { name: "AES-GCM" }, false, ["decrypt"]);
    var MAGIC = "LKHS1";
    var head = new Uint8Array(await dataFile.slice(0, MAGIC.length).arrayBuffer());
    var hs = ""; for (var j = 0; j < head.length; j++) hs += String.fromCharCode(head[j]);
    if (hs !== MAGIC) throw new Error("container");

    var baseIv = b64ToBytes(payload.baseiv);
    var cs = payload.chunkSize, n = payload.chunkCount, offset = MAGIC.length;
    var parts = [], tags = [];
    for (var i = 0; i < n; i++) {
      var size = (i === n - 1) ? (dataFile.size - offset) : (cs + 16);
      if (size < 16) throw new Error("truncated");
      var ct = new Uint8Array(await dataFile.slice(offset, offset + size).arrayBuffer());
      offset += size;
      var nonce = new Uint8Array(12); nonce.set(baseIv, 0);
      new DataView(nonce.buffer).setUint32(8, i, false);
      var aad = new Uint8Array(4); new DataView(aad.buffer).setUint32(0, i, false);
      parts.push(new Uint8Array(await s.decrypt(
        { name: "AES-GCM", iv: nonce, additionalData: aad }, aesKey, ct)));
      tags.push(ct.slice(ct.length - 16));
    }
    if (offset !== dataFile.size) throw new Error("trailing");

    var meta = enc(metaString(payload));
    var total = 0; for (var a = 0; a < tags.length; a++) total += tags[a].length;
    var macInput = new Uint8Array(meta.length + total);
    macInput.set(meta, 0);
    var o = meta.length;
    for (var b = 0; b < tags.length; b++) { macInput.set(tags[b], o); o += tags[b].length; }

    var hk = await s.importKey("raw", raw, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
    var mac = new Uint8Array(await s.sign("HMAC", hk, macInput));
    if (!equalBytes(mac, b64ToBytes(payload.metamac))) throw new Error("integrity");

    if (payload.sig) {
      var pub = await s.importKey("raw", b64ToBytes(payload.sig.pub), { name: "Ed25519" }, false, ["verify"]);
      var ok = await s.verify({ name: "Ed25519" }, pub, b64ToBytes(payload.sig.val), macInput);
      if (!ok) throw new Error("sig");
    }

    var outLen = 0; for (var c = 0; c < parts.length; c++) outLen += parts[c].length;
    var out = new Uint8Array(outLen), pos = 0;
    for (var d = 0; d < parts.length; d++) { out.set(parts[d], pos); pos += parts[d].length; }
    return out;
  }

  async function attempt() {
    var pin = $("pin").value;
    var keyMode = (payload.mode === "recipient" || payload.mode === "shares");
    var needPin = !(keyMode && !payload.pin);
    if (needPin && !pin) { $("msg").textContent = T.empty; $("msg").className = "msg err"; return; }
    if (!subtle()) { $("msg").textContent = T.norender; $("msg").className = "msg err"; return; }
    var keyfile = await readKeyfile();
    if (payload.keyfile && !keyfile) { $("msg").textContent = T.noKeyfile; $("msg").className = "msg err"; return; }

    if (payload.mode === "shares") {
      shareStrings = await readShares();
      var need = (payload.kdfparams && payload.kdfparams.k) || 1;
      if (shareStrings.length < need) {
        $("msg").textContent = (T.noShares || I18N.en.noShares);
        $("msg").className = "msg err"; return;
      }
    }

    if (payload.mode === "recipient") {
      var pk = $("privkey").files[0];
      if (!pk) { $("msg").textContent = (T.noKey || I18N.en.noKey); $("msg").className = "msg err"; return; }
      try { privateKeyObj = await importPrivateKey(pk); }
      catch (e) { $("msg").textContent = (T.badKey || I18N.en.badKey); $("msg").className = "msg err"; return; }
    }

    var isStream = payload.container === "stream";
    var dataFile = null;
    if (isStream) {
      dataFile = $("datafile").files[0];
      if (!dataFile) { $("msg").textContent = (T.noData || I18N.en.noData); $("msg").className = "msg err"; return; }
    }

    $("unlock").disabled = true;
    $("msg").textContent = T.decrypting; $("msg").className = "msg";

    var buf = null, usedDecoy = false, sigState = null;
    if (isStream) {
      try {
        buf = await streamDecrypt(dataFile, pin, keyfile);
        sigState = payload.sig ? "ok" : null;
      } catch (e) {
        if (String(e && e.message) === "sig") {
          $("unlock").disabled = false;
          $("msg").textContent = T.verifyBad; $("msg").className = "msg err";
          return;
        }
        buf = null;
      }
    } else {
      sigState = await verifySig();
      if (sigState === "bad") {
        $("msg").textContent = T.verifyBad; $("msg").className = "msg err";
        return;
      }
      try { buf = await decryptBlob(payload, pin, keyfile); }
      catch (e) {
        if (payload.decoy) {
          try { buf = await decryptBlob(payload.decoy, pin, keyfile); usedDecoy = true; }
          catch (e2) { buf = null; }
        }
      }
    }
    if (buf === null) {
      $("unlock").disabled = false;
      $("msg").textContent = T.wrong; $("msg").className = "msg err";
      return;
    }

    if (!usedDecoy) await bumpViews();

    if (sigState === "ok") { $("msg").textContent = T.verifyOk; $("msg").className = "msg ok"; }

    var kind = usedDecoy ? "html" : (payload.kind || "html");
    if (kind === "file") {
      renderFile(buf, payload.name);
    } else {
      renderHtml(new TextDecoder().decode(buf));
    }
    applyWatermark();
  }

  $("unlock").addEventListener("click", attempt);
  $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });

  if (payload.keyfile) $("kfRow").classList.remove("hidden");
  if (payload.container === "stream") $("dataRow").classList.remove("hidden");
  if (payload.mode === "recipient") {
    $("keyRow").classList.remove("hidden");
    if (!payload.pin) $("pin").classList.add("hidden");
  }
  if (payload.mode === "shares") {
    $("sharesRow").classList.remove("hidden");
    if (!payload.pin) $("pin").classList.add("hidden");
  }
  var meta = [];
  if (payload.maxviews) meta.push(payload.maxviews === 1 ? T.onetime : ("Views: " + payload.maxviews));
  if (payload.expires) meta.push("Expires " + payload.expires);
  if (payload.sig) meta.push("Signed (Ed25519)");
  setText("meta", meta.join("  \u00b7  "));

  var block = expiredState();
  if (block) { showBlocked(block); }
  else {
    getViews().then(function (n) {
      if (payload.maxviews && n >= payload.maxviews) { showBlocked("expired"); }
      else { $("pin").focus(); }
    });
  }

  document.addEventListener("contextmenu", function (e) {
    if (!$("stage").classList.contains("hidden")) e.preventDefault();
  });
  document.addEventListener("keydown", function (e) {
    if ($("stage").classList.contains("hidden")) return;
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === "p" || k === "s" || k === "u")) e.preventDefault();
  });
})();
</script>
</body>
</html>
