<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Protected document</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1b2130 0%, #0f1115 60%);
    color: #e8eaed; display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: min(430px, 92vw); padding: 30px 28px;
    background: #171a21; border: 1px solid #262b36; border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0,0,0,.5); text-align: center;
  }
  .lock { font-size: 32px; margin-bottom: 12px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  p.sub { font-size: 13px; color: #9aa3b2; margin: 0 0 20px; line-height: 1.5; }
  input[type=password] {
    width: 100%; padding: 13px 14px; font-size: 17px; letter-spacing: 3px;
    background: #0f1115; color: #fff; border: 1px solid #2c3340; border-radius: 10px;
    text-align: center; outline: none; transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #4c7dff; }
  button {
    width: 100%; margin-top: 12px; padding: 13px; font-size: 15px; font-weight: 600;
    color: #fff; background: linear-gradient(180deg,#5a86ff,#3a6bf0);
    border: 0; border-radius: 10px; cursor: pointer; transition: filter .15s;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; filter: none; }
  .msg { min-height: 18px; font-size: 13px; margin-top: 12px; }
  .msg.err { color: #ff6b6b; }
  .msg.warn { color: #ffb454; }
  .meta { font-size: 11px; color: #6b7280; margin-top: 18px; line-height: 1.6; }
  #stage { position: fixed; inset: 0; background: #0f1115; }
  #viewer { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div class="card" id="gate">
  <div class="lock" id="lockIcon">&#128274;</div>
  <h1 id="gateTitle">Protected document</h1>
  <p class="sub" id="gateSub">Enter the PIN to unlock this document.</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="off"
         placeholder="Enter PIN" aria-label="PIN">
  <button id="unlock">Unlock</button>
  <div class="msg" id="msg" role="status" aria-live="polite"></div>
  <div class="meta" id="meta"></div>
</div>

<div id="stage" class="hidden">
  <iframe id="viewer" sandbox="allow-scripts allow-forms allow-popups"></iframe>
</div>

<script id="payload" type="application/json">{"v": 1, "kdf": "PBKDF2-SHA256", "iter": 250000, "salt": "8pP988FDn8BVokqQ5wtO2g==", "iv": "iX8yDwmOUZk6x+IU", "ct": "Ximp3MoH9nMyaCx4SRypCsREJ/W4k6BjvCwnOdwllEB6OEmGlgfEA6MDZyXcM246QYdINHv2/vO3wFWwTPDWL6aW1i7c/iMv98GQXmgJRaXaHzO8eySU1zlWmraVRznegq5xs+QvmZSMjuKadwKuBu3GnPcTcmGwMT84rgVSjtYf3AWO+z+ZoCDSxjCPhJhkEg1ic5KCsoxTYK9TXNkYlb7EqQ7LjHaL7GqNdqCCgmjNLG/hpbJF3Wvs8kFXg2jRg2IeDiT6ywUUN9IuucNCCQTdUCGpQWrVaN8nbS+FVLBRW4Vs2w+pfWllrmlEGqbU9m9xh0Tvman/6Q2bsXB/JQnpgXmaughpYLgm1maGSqHrCPReXOPdYmbHeMSTaRiQBKouAMsXgA/OHK7ZVR1awaOKE3DYUqL0raeyPrcYwGqjiLkfaqqsjuA8mVy3gvLOubwpJIoSRyvXBu/YK2Zahgx9JZzvmTeWtqXh7/R2dA/nE/ZFytKoVlrmgZk89YEKQz1Dup7XERs7zN/6hlRDYbfBPELU5pkM2CgDUBNmaQN+//SP4a+NyP33TeTPST1Mm6DTpnt67x0HUXaaFQMsldcl8dXO7ErDznsUFQpHoi7iloxurw2kiPF9ooVj0/H1fa9+g90cpg/sRSG9h8m9Tt+t1HMTh6LrAUfIben9zW3q0u8dGGubx6sW7k+cnspEdXVc3LnbYaJksUCYfR4izoceJS34loVccDvAQGFSFtooLR8UMT0vUa+6qBbjhqP/dzGNP0kE36VJ+I0rNgc8r01PUZnHthUNdMLOgjYLx7JcaWabxiMjPCmfsG8+Z8Of9IoYKZonMFG9gKgxjjh51VLuPUnuka6C4jyHeseGGd3aMNsD+USyltcraf7MmTYlwC2Tjb92MdAAkGvnYYF0VLJCejGuTD5D/MTGXLWG8Sr0oilUy0ODgja7felxpQVPwGmc2DRV+VWsA0so0AUYEQcaIbLN3sy1hhzXUGUha+oKKX0TvDUqDhsJ+hWPMfIaYqFcJekmP2fKjC8gqqggquX+E+ia4rZWGyweN5Mg9oVu9oP9u6qX//O5SrfCWsfMSNX8WVW+2cI/gV0ZKTNILY5Me/TrYsyYxPml1sGWeKMT4PgMFmouQfgPdXv2KmcXttBY9tBNIZ121cZim2ZbrKvSV7W8pdOR2RFZqKw+1dBP2OXretxLaMXqmmls09fi1gul7nGxX6BTybyoBlkr1G0R5/Zs/IS7kMoPWmetqbAzKAMOJwXin6/Sv0J4Zu7tBaLIQTdZrIrkTB7+8FBYwDkBLw5TFb9q9i7g4BoZHoLymuWYI15tH0fXLnFcorf0PQWCfOypotqLvmR1inkikd0rBnNGflaVMUnPCTSGtxcdeamudpKkz7k8IjU/XTWcj7OC4pMuHhOWkz3P9AgJvfpumOkOG2ihWYGN7eerstJuw9XNYihtjR73k9jcdwhnFEphXJhvGOv4S3pROXI9ZA3ELaCM+OollOxIQtecEOiN3dg1uQkJZm+qSP+YvDDs1RQ7xKgkBNWaWCwda4w8XbNJPUcxzec4KxT3L5cl5eOfR25rloFW85nNS8zdN5XXxGQ+ugWVEI5sapX6eqT67eL6qJJ8YffA9gE=", "id": "192b6bf8f7628c09", "onetime": false}</script>
<script>
(function () {
  "use strict";
  var payload = JSON.parse(document.getElementById("payload").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var burnKey = "lockhtml_burn_" + payload.id;

  function b64ToBytes(s) {
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function subtle() {
    return (window.crypto && window.crypto.subtle) ? window.crypto.subtle : null;
  }
  async function deriveKey(pin) {
    var s = subtle();
    var baseKey = await s.importKey(
      "raw", new TextEncoder().encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]);
    return s.deriveKey(
      { name: "PBKDF2", salt: b64ToBytes(payload.salt),
        iterations: payload.iter, hash: "SHA-256" },
      baseKey, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decrypt(pin) {
    var s = subtle();
    var key = await deriveKey(pin);
    var buf = await s.decrypt({ name: "AES-GCM", iv: b64ToBytes(payload.iv) },
                              key, b64ToBytes(payload.ct));
    return new TextDecoder().decode(buf);
  }
  function isBurned() {
    try { return payload.onetime && localStorage.getItem(burnKey) === "1"; }
    catch (e) { return false; }
  }
  function markBurned() {
    try { localStorage.setItem(burnKey, "1"); } catch (e) {}
  }
  function showExpired() {
    $("lockIcon").innerHTML = "&#128465;";
    $("gateTitle").textContent = "This document has expired";
    $("gateSub").textContent =
      "It was set to be viewable once, and has already been opened.";
    $("pin").classList.add("hidden");
    $("unlock").classList.add("hidden");
    $("msg").textContent = "No further views are permitted.";
    $("msg").className = "msg warn";
  }
  function reveal(html) {
    $("viewer").srcdoc = html;
    $("stage").classList.remove("hidden");
    $("gate").classList.add("hidden");
    html = null; // best-effort: drop the plaintext reference
  }
  async function attempt() {
    var pin = $("pin").value;
    if (!pin) { $("msg").textContent = "Please enter the PIN."; $("msg").className = "msg err"; return; }
    if (!subtle()) {
      $("msg").textContent = "This browser cannot decrypt the file (needs Web Crypto).";
      $("msg").className = "msg err"; return;
    }
    $("unlock").disabled = true;
    $("msg").textContent = "Decrypting\u2026";
    $("msg").className = "msg";
    var html;
    try {
      html = await decrypt(pin);
    } catch (e) {
      $("unlock").disabled = false;
      $("msg").textContent = "Wrong PIN. Try again.";
      $("msg").className = "msg err";
      return;
    }
    if (payload.onetime) markBurned();
    reveal(html);
  }

  $("unlock").addEventListener("click", attempt);
  $("pin").addEventListener("keydown", function (e) { if (e.key === "Enter") attempt(); });

  if (payload.onetime) {
    $("meta").textContent =
      "One-time view \u2014 opening this document will expire it in this browser.";
  }
  if (isBurned()) { showExpired(); } else { $("pin").focus(); }

  // Deterrents only (not security): make casual copying of the open view harder.
  document.addEventListener("contextmenu", function (e) {
    if (!$("stage").classList.contains("hidden")) e.preventDefault();
  });
  document.addEventListener("keydown", function (e) {
    if ($("stage").classList.contains("hidden")) return;
    var k = (e.key || "").toLowerCase();
    if ((e.ctrlKey || e.metaKey) && (k === "p" || k === "s" || k === "u")) e.preventDefault();
  });
})();
</script>
</body>
</html>
