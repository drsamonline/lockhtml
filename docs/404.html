<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>404 — Locked out · LockHTML</title>
<meta name="description" content="Page not found — LockHTML.">
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#0a1024">
<link rel="icon" type="image/svg+xml" href="/lockhtml/assets/lockhtml-icon.svg">
<style>
:root{--navy:#0a1024;--cyan:#22d3ee;--cyan-soft:#67e8f9;--ink:#e7f0ff;--muted:#8fa4c6;--line:rgba(120,180,255,.14);--line-2:rgba(34,211,238,.28)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;
  background:#0a1024;color:var(--ink);display:grid;place-items:center;padding:24px;min-height:100vh;
}
body:before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(800px 480px at 70% 0%, rgba(34,211,238,.16), transparent 60%),
    radial-gradient(700px 460px at 15% 10%, rgba(59,130,246,.13), transparent 60%),
    linear-gradient(180deg,#0a1024,#080d1e);
}
.card{
  max-width:560px;width:100%;text-align:center;padding:46px 34px;border-radius:20px;
  background:linear-gradient(180deg,rgba(34,211,238,.07),rgba(255,255,255,.015));
  border:1px solid var(--line);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05);
}
.ring{
  width:104px;height:104px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 50% 40%,rgba(34,211,238,.16),rgba(10,16,36,.2) 70%);
  border:1px solid var(--line-2);
}
.ring:after{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px dashed rgba(34,211,238,.34);animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ring svg{width:46px;height:46px;color:var(--cyan);filter:drop-shadow(0 0 12px rgba(34,211,238,.5))}
h1{font-size:clamp(30px,7vw,52px);margin:0;letter-spacing:-.03em;font-weight:900}
h1 .cy{color:var(--cyan);text-shadow:0 0 30px rgba(34,211,238,.4)}
p{color:var(--muted);font-size:16px;margin:14px 0 26px}
a.btn{
  display:inline-flex;align-items:center;gap:9px;padding:13px 22px;border-radius:12px;
  font-weight:700;font-size:15px;text-decoration:none;color:#04121a;
  background:linear-gradient(180deg,var(--cyan-soft),var(--cyan));
  box-shadow:0 12px 32px rgba(34,211,238,.3);
}
a.btn svg{width:18px;height:18px}
a.link{display:block;margin-top:16px;color:var(--cyan-soft);font-size:14px;text-decoration:none}
a.link:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}
</style>
</head>
<body>
  <main class="card">
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.2"/><path d="M8 10.5V7a4 4 0 0 1 7.4-2.1"/><path d="M12 14.6v2"/></svg>
    </div>
    <h1>404 · <span class="cy">Locked out</span></h1>
    <p>This page isn't in the vault. The file may have been moved, expired, or never existed.</p>
    <a class="btn" href="/lockhtml/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>
      Back to LockHTML
    </a>
    <a class="link" href="/lockhtml/play/">Open the live app →</a>
  </main>
</body>
</html>
